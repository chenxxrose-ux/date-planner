name: 每月找新店
on:
  schedule:
    - cron: '47 1 1 * *'   # 每月 1 號 09:47（台灣時間）
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-update
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: 找新店
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: python scripts/find_new_places.py
      - name: 存回 GitHub
        run: |
          git config user.name "date-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "自動找新店" && git push)
